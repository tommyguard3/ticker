<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Cinéma La France — Concessions & Feature</title>
<style>
  :root {
    --bg-dark: #180c2e;
    --panel-bg: #29184a;
    --panel-border: #6344a6;
    --gold: #f5b942;
    --crimson: #e11d48;
    --accent-purple: #c084fc;
    --text-main: #ffffff;
    --text-muted: #dfd3f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  .screen {
    position: absolute;
    inset: 0;
    padding: 34px 48px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: scale(0.985);
    pointer-events: none;
    transition: opacity 0.7s ease, transform 0.7s ease;
    will-change: opacity, transform;
  }
  .screen.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--panel-border);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .brand-wrap {
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  .brand-title {
    font-size: 2.35rem;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-main);
  }
  .brand-title span { color: var(--gold); }
  .brand-sub {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent-purple);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .clock {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
  }
  .gear-btn {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--text-muted);
    font-size: 1.2rem;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .gear-btn:focus, .gear-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    outline: none;
  }
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 26px;
    flex: 1;
    min-height: 0;
  }
  .category-col {
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 16px;
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.65);
    min-height: 0;
  }
  .cat-header {
    font-size: 1.35rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gold);
    border-bottom: 2px solid var(--accent-purple);
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  .items-list {
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    flex: 1;
  }
  .menu-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
  }
  .menu-item:last-child { border-bottom: none; }
  .item-info { padding-right: 12px; }
  .item-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 4px;
  }
  .item-desc {
    font-size: 1.05rem;
    color: var(--text-muted);
  }
  .item-price {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--gold);
    white-space: nowrap;
  }
  .sold-out .item-name, .sold-out .item-desc {
    text-decoration: line-through;
    opacity: 0.45;
  }
  .sold-out .item-price {
    color: var(--crimson);
    font-size: 1.1rem;
    text-transform: uppercase;
  }
  .cat-footer-art {
    width: 100%;
    height: 165px;
    border-radius: 12px;
    margin-top: 14px;
    border: 1px solid var(--panel-border);
    background: #1b0f33;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .cat-footer-art svg {
    width: 100%;
    height: 100%;
  }
  .feature-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .now-badge {
    background: var(--gold);
    color: #180c2e;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 8px 24px;
    border-radius: 999px;
    margin-bottom: 22px;
  }
  .poster-frame {
    height: 54vh;
    aspect-ratio: 2 / 3;
    border-radius: 14px;
    overflow: hidden;
    border: 3px solid var(--gold);
    background: var(--panel-bg);
    margin-bottom: 22px;
    box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75);
  }
  .poster-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .movie-title {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 10px;
  }
  .movie-meta {
    display: flex;
    gap: 18px;
    align-items: center;
    font-size: 1.35rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .rating-pill {
    border: 2px solid var(--gold);
    color: var(--gold);
    padding: 2px 12px;
    border-radius: 6px;
    font-weight: 800;
  }
  .progress-track {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: rgba(255, 255, 255, 0.14);
  }
  .progress-fill {
    height: 100%;
    width: 100%;
    background: var(--gold);
    transform-origin: left;
    transform: scaleX(0);
  }
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 4, 22, 0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal-box {
    background: var(--panel-bg);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 32px;
    width: 540px;
    max-width: 90vw;
  }
  .modal-box h2 {
    margin-bottom: 16px;
    color: var(--gold);
    font-size: 1.5rem;
  }
  .modal-input {
    width: 100%;
    padding: 14px;
    font-size: 1.25rem;
    border-radius: 8px;
    border: 1px solid var(--panel-border);
    background: var(--bg-dark);
    color: #fff;
    margin-bottom: 14px;
  }
  .results-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: flex-end;
  }
  .btn {
    padding: 12px 20px;
    font-size: 1.1rem;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-primary { background: var(--gold); color: #180c2e; }
  .btn-secondary { background: #3b246b; color: #fff; border: 1px solid var(--panel-border); }
  .btn-secondary:hover, .btn-secondary:focus { border-color: var(--gold); outline: none; }
  .status-msg { margin-top: 12px; color: var(--gold); font-size: 1rem; }
</style>
</head>
<body>

<div id="screen-menu" class="screen active">
  <header>
    <div class="brand-wrap">
      <div class="brand-title">CINÉMA <span>LA FRANCE</span></div>
      <div class="brand-sub">Concessions</div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock-menu">--:--</div>
      <button class="gear-btn" onclick="openModal()" title="Change Movie">⚙ Movie</button>
    </div>
  </header>
  <div class="menu-grid" id="menu-container"></div>
</div>

<div id="screen-feature" class="screen">
  <header>
    <div class="brand-wrap">
      <div class="brand-title">CINÉMA <span>LA FRANCE</span></div>
      <div class="brand-sub">VIP Screening Room</div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock-feature">--:--</div>
      <button class="gear-btn" onclick="openModal()" title="Change Movie">⚙ Movie</button>
    </div>
  </header>
  <div class="feature-wrap">
    <div class="now-badge">Tonight's Feature Presentation</div>
    <div class="poster-frame"><img id="poster-img" src="" alt="Movie Poster"></div>
    <div class="movie-title" id="movie-title">Loading Feature...</div>
    <div class="movie-meta">
      <span class="rating-pill" id="movie-rating">FEATURE</span>
      <span id="movie-year">1987</span>
      <span>•</span>
      <span id="movie-runtime">Cinéma La France</span>
    </div>
  </div>
</div>

<div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>

<div class="modal-backdrop" id="movie-modal">
  <div class="modal-box">
    <h2>Set Tonight's Movie</h2>
    <input type="text" id="movie-search-input" class="modal-input" placeholder="e.g. Home Alone or Princess Bride">
    <div class="results-list" id="search-results"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="switchScreen()">Flip Screen</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="searchMovie()">Search</button>
    </div>
    <div class="status-msg" id="search-status"></div>
  </div>
</div>
<script>
const DEFAULT_SEARCH = "The Princess Bride";
const MENU_SECONDS = 45;
const FEATURE_SECONDS = 20;

const CONCESSIONS_MENU = [
  {
    category: "Hot & Savory",
    wikiFile: "File:Popcorn_Time_in_black_background.jpg",
    fallbackUrl: "https://wikimedia.org",
    items: [
      { name: "Fresh Buttered Popcorn", desc: "Popped fresh • Reg $1.50 / Lrg $2.25", price: "$1.50+", soldOut: false },
      { name: "Nachos with Cheese & Salsa", desc: "Warm cheddar sauce & zesty salsa", price: "$2.00", soldOut: false },
      { name: "Potato Chips", desc: "Classic crispy salted & flavored bags", price: "$1.00", soldOut: false }
    ]
  },
  {
    category: "Theatre Candy",
    wikiFile: "File:Candy_in_Damascus.jpg",
    fallbackUrl: "https://wikimedia.org",
    items: [
      { name: "Twizzlers", desc: "Classic strawberry twists", price: "$1.00", soldOut: false },
      { name: "Sour Patch Kids", desc: "Sour then sweet chewy candy", price: "$1.25", soldOut: false },
      { name: "Chocolate Bars", desc: "Assorted favorites & M&Ms", price: "$1.00", soldOut: false }
    ]
  },
  {
    category: "Ice Cold Drinks",
    wikiFile: "File:Tumbler_of_cola_with_ice.jpg",
    fallbackUrl: "https://wikimedia.org",
    items: [
      { name: "Ice Cold Soda", desc: "Cola, Root Beer, Sprite & Orange", price: "$1.25", soldOut: false },
      { name: "Combo Special", desc: "Large Popcorn + Any 2 Drinks", price: "$4.25", soldOut: false }
    ]
  }
];

function renderMenu() {
  const container = document.getElementById("menu-container");
  container.innerHTML = CONCESSIONS_MENU.map((col, idx) => {
    const itemsHtml = col.items.map(item =>
      '<div class="menu-item ' + (item.soldOut ? 'sold-out' : '') + '">' +
        '<div class="item-info">' +
          '<div class="item-name">' + item.name + '</div>' +
          '<div class="item-desc">' + item.desc + '</div>' +
        '</div>' +
        '<div class="item-price">' + (item.soldOut ? 'Sold Out' : item.price) + '</div>' +
      '</div>'
    ).join("");
    const imgHtml = '<div class="cat-footer-art"><img id="cat-img-' + idx + '" src="' + col.fallbackUrl + '" alt="' + col.category + '" style="width:100%;height:100%;object-fit:cover;"></div>';
    return '<div class="category-col">' +
      '<div><div class="cat-header">' + col.category + '</div></div>' +
      '<div class="items-list">' + itemsHtml + '</div>' +
      imgHtml +
    '</div>';
  }).join("");
  optimizeCategoryPhotos();
}

async function optimizeCategoryPhotos() {
  const host = ["commons", "wikimedia", "org"].join(".");
  const path = ["", "w", "api.php"].join("/");
  for (let i = 0; i < CONCESSIONS_MENU.length; i++) {
    try {
      const col = CONCESSIONS_MENU.at(i);
      const endpoint = new URL("https://" + host + path);
      endpoint.searchParams.set("action", "query");
      endpoint.searchParams.set("format", "json");
      endpoint.searchParams.set("origin", "*");
      endpoint.searchParams.set("titles", col.wikiFile);
      endpoint.searchParams.set("prop", "imageinfo");
      endpoint.searchParams.set("iiprop", "url");
      endpoint.searchParams.set("iiurlwidth", "800");
      const res = await fetch(endpoint.toString());
      const json = await res.json();
      const pages = json.query && json.query.pages ? Object.values(json.query.pages) : [];
      const firstPage = pages.at(0);
      const info = firstPage && firstPage.imageinfo ? firstPage.imageinfo.at(0) : null;
      if (info && info.thumburl) {
        const imgEl = document.getElementById("cat-img-" + i);
        if (imgEl) imgEl.src = info.thumburl;
      }
    } catch (e) {}
  }
}
function updateClocks() {
  const now = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  document.getElementById("clock-menu").textContent = now;
  document.getElementById("clock-feature").textContent = now;
}

let showingMenu = true;
let cycleTimer = null;

function startCycle() {
  clearTimeout(cycleTimer);
  const duration = (showingMenu ? MENU_SECONDS : FEATURE_SECONDS) * 1000;
  const bar = document.getElementById("progress-bar");
  bar.style.transition = "none";
  bar.style.transform = "scaleX(0)";
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      bar.style.transition = "transform " + duration + "ms linear";
      bar.style.transform = "scaleX(1)";
    });
  });
  cycleTimer = setTimeout(() => {
    showingMenu = !showingMenu;
    document.getElementById("screen-menu").classList.toggle("active", showingMenu);
    document.getElementById("screen-feature").classList.toggle("active", !showingMenu);
    startCycle();
  }, duration);
}

function switchScreen() {
  showingMenu = !showingMenu;
  document.getElementById("screen-menu").classList.toggle("active", showingMenu);
  document.getElementById("screen-feature").classList.toggle("active", !showingMenu);
  closeModal();
  startCycle();
}

function applyMovieData(data) {
  document.getElementById("poster-img").src = data.poster;
  document.getElementById("movie-title").textContent = data.title;
  document.getElementById("movie-rating").textContent = data.rating || "FEATURE";
  document.getElementById("movie-year").textContent = data.year || "Tonight's Show";
  document.getElementById("movie-runtime").textContent = data.runtime || "Cinéma La France";
}

function searchItunesJSONP(query) {
  return new Promise((resolve, reject) => {
    const cbName = "cbMovie_" + Date.now();
    const script = document.createElement("script");
    const host = ["itunes", "apple", "com"].join(".");
    const endpoint = new URL("https://" + host + "/search");
    endpoint.searchParams.set("term", query);
    endpoint.searchParams.set("media", "movie");
    endpoint.searchParams.set("limit", "6");
    endpoint.searchParams.set("callback", cbName);

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("Search timed out"));
    }, 6000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = (data) => {
      cleanup();
      const list = (data && data.results ? data.results : []).filter(m => m.artworkUrl100 && m.trackName);
      if (list.length === 0) {
        reject(new Error("No matches found"));
        return;
      }
      resolve(list.slice(0, 4).map(m => {
        const mins = m.trackTimeMillis ? Math.round(m.trackTimeMillis / 60000) : 0;
        const runtimeStr = mins ? Math.floor(mins / 60) + "h " + (mins % 60) + "m" : "Feature Presentation";
        return {
          title: m.trackName,
          poster: m.artworkUrl100.replace("100x100bb", "900x900bb"),
          rating: m.contentAdvisoryRating || "PG",
          year: m.releaseDate ? m.releaseDate.slice(0, 4) : "",
          runtime: runtimeStr
        };
      }));
    };

    script.src = endpoint.toString();
    script.onerror = () => { cleanup(); reject(new Error("Network error")); };
    document.body.appendChild(script);
  });
}

function selectMovie(movieObj) {
  localStorage.setItem("savedMovieData", JSON.stringify(movieObj));
  applyMovieData(movieObj);
  closeModal();
}

function openModal() {
  document.getElementById("movie-modal").classList.add("open");
  document.getElementById("search-status").textContent = "";
  document.getElementById("search-results").innerHTML = "";
  const input = document.getElementById("movie-search-input");
  input.value = "";
  input.focus();
}

function closeModal() {
  document.getElementById("movie-modal").classList.remove("open");
}

async function searchMovie() {
  const query = document.getElementById("movie-search-input").value.trim();
  if (!query) return;
  const status = document.getElementById("search-status");
  const resultsBox = document.getElementById("search-results");
  resultsBox.innerHTML = "";
  status.textContent = "Searching movies...";
  try {
    const matches = await searchItunesJSONP(query);
    status.textContent = "Select a movie:";
    matches.forEach(movie => {
      const btn = document.createElement("button");
      btn.className = "btn btn-secondary";
      btn.style.textAlign = "left";
      btn.textContent = movie.title + " (" + movie.year + ") • " + movie.rating;
      btn.onclick = () => selectMovie(movie);
      resultsBox.appendChild(btn);
    });
  } catch (e) {
    console.error("Movie search error:", e);
    status.textContent = "No movies found — check spelling and try again.";
  }
}

document.addEventListener("keydown", (e) => {
  const modalOpen = document.getElementById("movie-modal").classList.contains("open");
  if (!modalOpen && (e.key === "Enter" || e.key === "m" || e.key === "M")) {
    openModal();
  } else if (modalOpen && e.key === "Enter" && document.activeElement.id === "movie-search-input") {
    searchMovie();
  } else if (modalOpen && e.key === "Escape") {
    closeModal();
  }
});

renderMenu();
updateClocks();
setInterval(updateClocks, 15000);
startCycle();

const cached = localStorage.getItem("savedMovieData");
if (cached) {
  applyMovieData(JSON.parse(cached));
} else {
  searchItunesJSONP(DEFAULT_SEARCH)
    .then(matches => selectMovie(matches.at(0)))
    .catch(() => {});
}
</script>
</body>
</html>
