<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Sports Desk</title>
<style>
  @import url('https://googleapis.com');

  :root {
    --bg-gradient: radial-gradient(circle at top right, #102a54 0%, #07142b 55%, #040b18 100%);
    --card-bg: rgba(15, 35, 68, 0.88);
    --card-border: rgba(56, 189, 248, 0.22);
    --fav-tier1-border: #facc15;
    --fav-tier1-bg: linear-gradient(145deg, rgba(23, 49, 92, 0.95) 0%, rgba(46, 40, 18, 0.92) 100%);
    --fav-tier2-border: #38bdf8;
    --text-main: #ffffff;
    --text-muted: #93c5fd;
    --live-red: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg-gradient);
    color: var(--text-main);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 2vh 2.5vw;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 1.2vh;
    border-bottom: 1px solid rgba(56, 189, 248, 0.25);
    margin-bottom: 1.8vh;
    flex-shrink: 0;
  }

  .status-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .live-badge {
    background: var(--live-red);
    color: white;
    font-weight: 900;
    font-size: 0.85rem;
    padding: 5px 12px;
    border-radius: 4px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }

  .league-pill {
    background: rgba(15, 38, 74, 0.9);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #e0f2fe;
    font-size: 0.9rem;
    padding: 5px 14px;
    border-radius: 6px;
    font-weight: 700;
    letter-spacing: 0.8px;
  }

  .clock-area {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-family: 'JetBrains Mono', monospace;
  }

  #clock-time {
    font-size: 1.8rem;
    font-weight: 700;
    color: #ffffff;
  }

  #clock-date {
    font-size: 0.95rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #scoreboard-grid {
    display: grid;
    gap: 16px;
    flex-grow: 1;
    min-height: 0;
    width: 100%;
    align-content: stretch;
  }

  @keyframes cardSlideIn {
    0% { opacity: 0; transform: translateY(14px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes scoreFlash {
    0% { background-color: rgba(250, 204, 21, 0.45); transform: scale(1.03); }
    100% { background-color: transparent; transform: scale(1); }
  }

  @keyframes liveBorderGlow {
    0%, 100% { box-shadow: 0 8px 24px rgba(2, 8, 23, 0.55), 0 0 0px rgba(74, 222, 128, 0); }
    50% { box-shadow: 0 8px 24px rgba(2, 8, 23, 0.55), 0 0 16px rgba(74, 222, 128, 0.28); }
  }

  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 8px 24px rgba(2, 8, 23, 0.55);
    min-height: 0;
    animation: cardSlideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .game-card.is-live-card {
    border-color: rgba(74, 222, 128, 0.55);
    animation: cardSlideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both, liveBorderGlow 3.5s ease-in-out infinite;
  }

  .game-card.fav-tier1 {
    background: var(--fav-tier1-bg);
    border: 2px solid var(--fav-tier1-border);
  }

  .game-card.fav-tier2 {
    border: 2px solid var(--fav-tier2-border);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .league-tag {
    color: #38bdf8;
    font-weight: 800;
  }

  .status-text {
    color: var(--text-muted);
  }

  .status-text.is-live {
    color: #4ade80;
    font-weight: 800;
  }

  .team-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 0;
  }

  .team-row:first-of-type {
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  }

  .score-updated {
    border-radius: 6px;
    animation: scoreFlash 2.2s ease-out;
  }

  .team-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .team-logo {
    width: 34px;
    height: 34px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .team-name {
    font-size: 1.25rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-record {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-weight: 400;
    flex-shrink: 0;
  }

  .team-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.65rem;
    font-weight: 700;
    margin-left: 12px;
    flex-shrink: 0;
  }

  .winner {
    color: #ffffff;
  }

  .loser {
    color: #7dd3fc;
    opacity: 0.55;
  }

  footer {
    margin-top: 1.8vh;
    background: rgba(8, 22, 46, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-top: 2px solid #0ea5e9;
    border-radius: 8px;
    height: 46px;
    display: flex;
    align-items: center;
    overflow: hidden;
    flex-shrink: 0;
  }

  .ticker-label {
    background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
    clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%);
    color: white;
    font-weight: 900;
    padding: 0 28px 0 20px;
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 0.9rem;
    letter-spacing: 1px;
    white-space: nowrap;
    z-index: 2;
  }

  .ticker-wrap {
    flex-grow: 1;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
  }

  .ticker-move {
    display: inline-block;
    padding-left: 100%;
    animation: ticker 90s linear infinite;
    font-size: 1.05rem;
    font-weight: 600;
    color: #f0f9ff;
  }

  @keyframes ticker {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
    font-size: 1.4rem;
  }
</style>
</head>
<body>

<header>
  <div class="status-area">
    <div class="live-badge">LIVE</div>
    <div class="league-pill" id="page-indicator">UPDATING...</div>
  </div>
  <div class="clock-area">
    <div id="clock-date">LOADING</div>
    <div id="clock-time">--:--</div>
  </div>
</header>

<main id="scoreboard-grid">
  <div class="empty-state">Fetching live sports scores...</div>
</main>

<footer>
  <div class="ticker-label">UPCOMING &amp; WIRE</div>
  <div class="ticker-wrap">
    <div class="ticker-move" id="bottom-ticker">Loading live schedules...</div>
  </div>
</footer>

<script>
  const LEAGUES = Array.of(
    { id: 'MLB', tier: 1, sport: 'baseball', slug: 'mlb' },
    { id: 'NHL', tier: 1, sport: 'hockey', slug: 'nhl' },
    { id: 'CFL', tier: 1, sport: 'football', slug: 'cfl' },
    { id: 'NBA', tier: 2, sport: 'basketball', slug: 'nba' },
    { id: 'NFL', tier: 2, sport: 'football', slug: 'nfl' },
    { id: 'UFC', tier: 2, sport: 'mma', slug: 'ufc' },
    { id: 'WBC', tier: 3, sport: 'baseball', slug: 'world-baseball-classic' },
    { id: 'WINTER BB', tier: 3, sport: 'baseball', slug: 'caribbean-series' }
  );

  const TIER1_FAVS = Array.of('Blue Jays', 'Maple Leafs', 'Argonauts', 'Raptors', 'Toronto');
  const TIER2_FAVS = Array.of('Wild', 'Minnesota', 'Cardinals', 'St. Louis');

  let allGames = Array.of();
  let currentPage = 0;
  let previousScores = new Map();

  function updateClock() {
    const now = new Date();
    document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  function getTeamPriority(teamName) {
    if (!teamName) return 99;
    const lower = teamName.toLowerCase();
    for (let i = 0; i < TIER1_FAVS.length; i++) {
      if (lower.includes(TIER1_FAVS.at(i).toLowerCase())) return 1 + (i * 0.1);
    }
    for (let i = 0; i < TIER2_FAVS.length; i++) {
      if (lower.includes(TIER2_FAVS.at(i).toLowerCase())) return 10 + (i * 0.1);
    }
    return 50;
  }

  function getScoreboardEndpoint(sport, slug) {
    const host = Array.of('site', 'web', 'api', 'espn', 'com').join('.');
    const parts = Array.of('https:', '', host, 'apis', 'site', 'v2', 'sports', sport, slug, 'scoreboard');
    return parts.join('/');
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function isWithinActiveWindow(eventDateStr) {
    if (!eventDateStr) return true;
    const gameTime = new Date(eventDateStr).getTime();
    if (isNaN(gameTime)) return true;
    const now = Date.now();
    const hoursDiff = (gameTime - now) / (1000 * 60 * 60);
    return hoursDiff >= -24 && hoursDiff <= 36;
  }

  function calculateGridLayout() {
    const grid = document.getElementById('scoreboard-grid');
    const availableWidth = grid.clientWidth || window.innerWidth;
    const availableHeight = grid.clientHeight || (window.innerHeight - 150);

    const cols = Math.max(1, Math.floor((availableWidth + 16) / 356));
    const rows = Math.max(1, Math.floor((availableHeight + 16) / 164));

    grid.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', minmax(0, 1fr))';

    return cols * rows;
  }

  function updateTickerSpeed() {
    const tickerEl = document.getElementById('bottom-ticker');
    const containerWidth = tickerEl.parentElement.clientWidth || 1000;
    const textWidth = tickerEl.scrollWidth || 2000;
    const totalDistance = containerWidth + textWidth;
    const durationSeconds = Math.max(25, Math.round(totalDistance / 95));
    tickerEl.style.animationDuration = durationSeconds + 's';
  }
  async function fetchAllSports() {
    let fetchedGames = Array.of();
    let wireHeadlines = Array.of();

    for (const lg of LEAGUES) {
      try {
        const endpoint = getScoreboardEndpoint(lg.sport, lg.slug);
        const res = await fetch(endpoint);
        if (!res.ok) continue;

        const data = await res.json();
        const events = (data && data.events) ? data.events : Array.of();

        for (const ev of events) {
          if (!isWithinActiveWindow(ev.date)) continue;

          const comp = ev.competitions && ev.competitions.at(0);
          if (!comp || !comp.competitors) continue;

          if (lg.id === 'UFC') {
            if (comp.competitors.length >= 2) {
              const c0 = comp.competitors.at(0);
              const c1 = comp.competitors.at(1);
              const f1 = c0.athlete ? c0.athlete.displayName : 'Fighter 1';
              const f2 = c1.athlete ? c1.athlete.displayName : 'Fighter 2';
              const status = ev.status && ev.status.type ? ev.status.type.shortDetail : 'Scheduled';
              const state = ev.status && ev.status.type ? ev.status.type.state : 'pre';
              const ufcLogo = Array.of('https:', '', '://espncdn.com', 'i', 'teamlogos', 'leagues', '500', 'ufc.png').join('/');
              fetchedGames.push({
                league: 'UFC',
                leagueTier: lg.tier,
                favScore: 40,
                isLive: state === 'in',
                isFinal: state === 'post',
                status: status,
                away: { name: f1, score: c0.winner ? 'WIN' : '', logo: ufcLogo, record: '' },
                home: { name: f2, score: c1.winner ? 'WIN' : '', logo: ufcLogo, record: '' }
              });
            }
            continue;
          }

          const homeComp = comp.competitors.find(c => c.homeAway === 'home') || comp.competitors.at(0);
          const awayComp = comp.competitors.find(c => c.homeAway === 'away') || comp.competitors.at(1);
          if (!homeComp || !awayComp) continue;

          const homeName = (homeComp.team && (homeComp.team.shortDisplayName || homeComp.team.name)) || 'Home';
          const awayName = (awayComp.team && (awayComp.team.shortDisplayName || awayComp.team.name)) || 'Away';
          const homeFull = (homeComp.team && homeComp.team.displayName) || homeName;
          const awayFull = (awayComp.team && awayComp.team.displayName) || awayName;

          const bestFavScore = Math.min(getTeamPriority(homeFull), getTeamPriority(awayFull));
          const state = ev.status && ev.status.type ? ev.status.type.state : 'pre';
          const statusDetail = ev.status && ev.status.type ? ev.status.type.shortDetail : '';

          const awayRec = (awayComp.records && awayComp.records.at(0)) ? awayComp.records.at(0).summary : '';
          const homeRec = (homeComp.records && homeComp.records.at(0)) ? homeComp.records.at(0).summary : '';

          const gameObj = {
            league: lg.id,
            leagueTier: lg.tier,
            favScore: bestFavScore,
            isLive: state === 'in',
            isFinal: state === 'post',
            status: statusDetail,
            away: {
              name: awayName,
              score: state === 'pre' ? '' : (awayComp.score || '0'),
              logo: (awayComp.team && awayComp.team.logo) || '',
              record: awayRec
            },
            home: {
              name: homeName,
              score: state === 'pre' ? '' : (homeComp.score || '0'),
              logo: (homeComp.team && homeComp.team.logo) || '',
              record: homeRec
            }
          };

          fetchedGames.push(gameObj);

          const scoreSummary = state === 'pre'
            ? (awayName + ' vs ' + homeName + ' (' + statusDetail + ')')
            : (awayName + ' ' + gameObj.away.score + ' - ' + homeName + ' ' + gameObj.home.score + ' (' + statusDetail + ')');
          wireHeadlines.push(lg.id + ': ' + scoreSummary);
        }
      } catch (e) {
        console.warn('Skipped league:', lg.id, e);
      }
      await sleep(150);
    }

    fetchedGames.sort((a, b) => {
      if (a.favScore !== b.favScore) return a.favScore - b.favScore;
      if (a.isLive !== b.isLive) return a.isLive ? -1 : 1;
      return a.leagueTier - b.leagueTier;
    });

    allGames = fetchedGames;

    const tickerEl = document.getElementById('bottom-ticker');
    if (wireHeadlines.length > 0) {
      tickerEl.textContent = wireHeadlines.join('     •     ');
    } else {
      tickerEl.textContent = 'MONITORING MLB • NHL • CFL • NBA • NFL • UFC • INTERNATIONAL BASEBALL';
    }
    updateTickerSpeed();

    renderBoard();
  }
  function renderBoard() {
    const grid = document.getElementById('scoreboard-grid');
    const indicator = document.getElementById('page-indicator');
    const cardsPerPage = calculateGridLayout();

    if (allGames.length === 0) {
      grid.innerHTML = '<div class="empty-state">No games within the active 24-hour window.<br><span style="font-size:1rem; margin-top:10px; display:block;">Auto-checking feeds every 45 seconds...</span></div>';
      indicator.textContent = 'STANDBY';
      return;
    }

    const totalPages = Math.ceil(allGames.length / cardsPerPage);
    if (currentPage >= totalPages) currentPage = 0;

    const start = currentPage * cardsPerPage;
    const pageGames = allGames.slice(start, start + cardsPerPage);

    indicator.textContent = totalPages > 1
      ? ('PAGE ' + (currentPage + 1) + ' OF ' + totalPages + ' • ' + allGames.length + ' GAMES')
      : (allGames.length + ' GAMES');

    grid.innerHTML = pageGames.map((g, idx) => {
      const gameKey = g.league + '-' + g.away.name + '-' + g.home.name;
      const prev = previousScores.get(gameKey);
      const awayScored = prev && prev.away !== '' && g.away.score !== '' && prev.away !== g.away.score;
      const homeScored = prev && prev.home !== '' && g.home.score !== '' && prev.home !== g.home.score;
      previousScores.set(gameKey, { away: g.away.score, home: g.home.score });

      let cardClass = 'game-card';
      if (g.favScore < 10) cardClass += ' fav-tier1';
      else if (g.favScore < 50) cardClass += ' fav-tier2';
      if (g.isLive) cardClass += ' is-live-card';

      const awayScoreNum = parseInt(g.away.score, 10);
      const homeScoreNum = parseInt(g.home.score, 10);
      const showWinner = g.isFinal && !isNaN(awayScoreNum) && !isNaN(homeScoreNum);

      const awayClass = showWinner ? (awayScoreNum > homeScoreNum ? 'winner' : 'loser') : '';
      const homeClass = showWinner ? (homeScoreNum > awayScoreNum ? 'winner' : 'loser') : '';
      const delayStyle = 'animation-delay: ' + (idx * 45) + 'ms;';

      return '<div class="' + cardClass + '" style="' + delayStyle + '">' +
        '<div class="card-header">' +
          '<span class="league-tag">' + g.league + '</span>' +
          '<span class="status-text ' + (g.isLive ? 'is-live' : '') + '">' + g.status + '</span>' +
        '</div>' +
        '<div class="team-row ' + (awayScored ? 'score-updated' : '') + '">' +
          '<div class="team-info">' +
            '<img class="team-logo" src="' + g.away.logo + '" onerror="this.style.display=\'none\'">' +
            '<span class="team-name ' + awayClass + '">' + g.away.name + '</span>' +
            '<span class="team-record">' + g.away.record + '</span>' +
          '</div>' +
          '<div class="team-score ' + awayClass + '">' + g.away.score + '</div>' +
        '</div>' +
        '<div class="team-row ' + (homeScored ? 'score-updated' : '') + '">' +
          '<div class="team-info">' +
            '<img class="team-logo" src="' + g.home.logo + '" onerror="this.style.display=\'none\'">' +
            '<span class="team-name ' + homeClass + '">' + g.home.name + '</span>' +
            '<span class="team-record">' + g.home.record + '</span>' +
          '</div>' +
          '<div class="team-score ' + homeClass + '">' + g.home.score + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  window.addEventListener('resize', () => {
    renderBoard();
    updateTickerSpeed();
  });

  setInterval(() => {
    const cardsPerPage = calculateGridLayout();
    const totalPages = Math.ceil(allGames.length / cardsPerPage);
    if (totalPages > 1) {
      currentPage = (currentPage + 1) % totalPages;
      renderBoard();
    }
  }, 12000);

  fetchAllSports();
  setInterval(fetchAllSports, 45000);
</script>
</body>
</html>
