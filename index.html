<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Sports Desk</title>
<style>
  @import url('https://googleapis.com');

  :root {
    --card-bg: rgba(13, 32, 64, 0.88);
    --card-border: rgba(56, 189, 248, 0.24);
    --fav-tier1-border: #facc15;
    --fav-tier1-bg: linear-gradient(145deg, rgba(23, 49, 92, 0.95) 0%, rgba(46, 40, 18, 0.92) 100%);
    --fav-tier2-border: #38bdf8;
    --text-main: #ffffff;
    --text-muted: #93c5fd;
    --live-red: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  @keyframes studioSweep {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  body {
    background: linear-gradient(-45deg, #040b18, #0b2247, #06142e, #123366);
    background-size: 300% 300%;
    animation: studioSweep 22s ease infinite;
    color: var(--text-main);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 2.2vh 2.5vw;
    position: relative;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 1.4vh;
    border-bottom: 1px solid rgba(56, 189, 248, 0.25);
    margin-bottom: 2vh;
    flex-shrink: 0;
    z-index: 2;
  }

  .status-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .live-badge {
    background: var(--live-red);
    color: white;
    font-weight: 900;
    font-size: 0.9rem;
    padding: 5px 12px;
    border-radius: 4px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    animation: pulse 2.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .league-pill {
    background: rgba(15, 38, 74, 0.9);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #e0f2fe;
    font-size: 0.9rem;
    padding: 5px 14px;
    border-radius: 6px;
    font-weight: 700;
    letter-spacing: 0.8px;
  }

  .clock-area {
    display: flex;
    align-items: baseline;
    gap: 14px;
    font-family: 'JetBrains Mono', monospace;
  }

  #clock-time {
    font-size: 1.85rem;
    font-weight: 700;
    color: #ffffff;
  }

  #clock-date {
    font-size: 0.95rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #scoreboard-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 2.2vh 1.8vw;
    flex-grow: 1;
    min-height: 0;
    width: 100%;
    z-index: 2;
  }

  @keyframes cardSlideIn {
    0% { opacity: 0.35; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  @keyframes scoreFlash {
    0% { background-color: rgba(250, 204, 21, 0.45); transform: scale(1.02); }
    100% { background-color: transparent; transform: scale(1); }
  }

  @keyframes liveBorderGlow {
    0%, 100% { box-shadow: 0 8px 24px rgba(2, 8, 23, 0.55), 0 0 0px rgba(74, 222, 128, 0); }
    50% { box-shadow: 0 8px 24px rgba(2, 8, 23, 0.55), 0 0 16px rgba(74, 222, 128, 0.28); }
  }

  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 1.8vh 1.8vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 8px 24px rgba(2, 8, 23, 0.55);
    min-height: 0;
    overflow: hidden;
    animation: cardSlideIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .game-card.is-live-card {
    border-color: rgba(74, 222, 128, 0.55);
    animation: cardSlideIn 0.85s cubic-bezier(0.16, 1, 0.3, 1) both, liveBorderGlow 4s ease-in-out infinite;
  }

  .game-card.fav-tier1 {
    background: var(--fav-tier1-bg);
    border: 2px solid var(--fav-tier1-border);
  }

  .game-card.fav-tier2 {
    border: 2px solid var(--fav-tier2-border);
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: clamp(0.8rem, 1.05vw, 0.98rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .league-tag {
    color: #38bdf8;
    font-weight: 800;
  }

  .status-text {
    color: var(--text-muted);
  }

  .status-text.is-live {
    color: #4ade80;
    font-weight: 800;
  }

  .team-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.8vh 0;
  }

  .team-row:first-of-type {
    border-bottom: 1px solid rgba(148, 163, 184, 0.16);
  }

  .score-updated {
    border-radius: 6px;
    animation: scoreFlash 2.2s ease-out;
  }

  .team-info {
    display: flex;
    align-items: center;
    gap: 1vw;
    min-width: 0;
  }

  .team-logo {
    width: clamp(30px, 3vw, 48px);
    height: clamp(30px, 3vw, 48px);
    object-fit: contain;
    flex-shrink: 0;
  }

  .team-name {
    font-size: clamp(1.1rem, 1.55vw, 1.75rem);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-record {
    font-size: clamp(0.76rem, 0.9vw, 0.96rem);
    color: var(--text-muted);
    font-weight: 400;
    flex-shrink: 0;
  }

  .team-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.5rem, 2.2vw, 2.4rem);
    font-weight: 700;
    margin-left: 12px;
    flex-shrink: 0;
  }

  .winner {
    color: #ffffff;
  }

  .loser {
    color: #7dd3fc;
    opacity: 0.55;
  }

  .card-footer-stat {
    margin-top: 0.6vh;
    padding-top: 0.8vh;
    border-top: 1px solid rgba(56, 189, 248, 0.18);
    font-size: clamp(0.76rem, 0.95vw, 1.02rem);
    color: #bae6fd;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .card-footer-stat span {
    color: #38bdf8;
    font-weight: 800;
    margin-right: 6px;
    text-transform: uppercase;
  }

  /* Framed Studio Photo Recap Overlay */
  #recap-overlay {
    position: fixed;
    top: 9.8vh;
    bottom: 9.8vh;
    left: 2.5vw;
    right: 2.5vw;
    background: #06142e;
    border: 2px solid rgba(56, 189, 248, 0.45);
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
    z-index: 20;
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  #recap-overlay.active {
    display: flex;
  }

  @keyframes kenBurns {
    0% { transform: scale(1) translate(0, 0); }
    100% { transform: scale(1.07) translate(-1%, -1%); }
  }

  #recap-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.74;
    animation: kenBurns 10s ease-out forwards;
  }

  .recap-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(4, 11, 24, 0.95) 0%, rgba(4, 11, 24, 0.4) 55%, rgba(4, 11, 24, 0.2) 100%);
  }

  .recap-content {
    position: relative;
    z-index: 2;
    padding: 3.5vh 3.5vw;
    max-width: 88%;
  }

  .recap-badge {
    display: inline-block;
    background: #dc2626;
    color: white;
    font-weight: 900;
    font-size: 0.9rem;
    padding: 5px 14px;
    border-radius: 4px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  #recap-headline {
    font-size: clamp(1.55rem, 2.7vw, 2.9rem);
    font-weight: 900;
    line-height: 1.15;
    color: #ffffff;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8);
  }

  #recap-subline {
    font-size: clamp(0.95rem, 1.25vw, 1.3rem);
    color: #93c5fd;
    margin-top: 10px;
    font-weight: 600;
  }
  footer {
    margin-top: 2vh;
    background: rgba(8, 22, 46, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-top: 2px solid #0ea5e9;
    border-radius: 8px;
    height: 48px;
    display: flex;
    align-items: center;
    overflow: hidden;
    flex-shrink: 0;
    z-index: 2;
  }

  .ticker-label {
    background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
    clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%);
    color: white;
    font-weight: 900;
    padding: 0 28px 0 20px;
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 0.9rem;
    letter-spacing: 1px;
    white-space: nowrap;
    z-index: 2;
  }

  .ticker-wrap {
    flex-grow: 1;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
  }

  .ticker-move {
    display: inline-block;
    padding-left: 100%;
    animation: ticker 90s linear infinite;
    font-size: 1.05rem;
    font-weight: 600;
    color: #f0f9ff;
  }

  @keyframes ticker {
    0% { transform: translate3d(0, 0, 0); }
    100% { transform: translate3d(-100%, 0, 0); }
  }

  .empty-state {
    grid-column: 1 / -1;
    grid-row: 1 / -1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: var(--text-muted);
    font-size: 1.4rem;
  }
</style>
</head>
<body>

<header>
  <div class="status-area">
    <div class="live-badge">LIVE</div>
    <div class="league-pill" id="page-indicator">UPDATING...</div>
  </div>
  <div class="clock-area">
    <div id="clock-date">LOADING</div>
    <div id="clock-time">--:--</div>
  </div>
</header>

<main id="scoreboard-grid">
  <div class="empty-state">Fetching live sports scores...</div>
</main>

<div id="recap-overlay">
  <img id="recap-image" src="" alt="">
  <div class="recap-scrim"></div>
  <div class="recap-content">
    <div class="recap-badge" id="recap-league-badge">SPORTS DESK RECAP</div>
    <div id="recap-headline"></div>
    <div id="recap-subline"></div>
  </div>
</div>

<footer>
  <div class="ticker-label">TOP STORIES</div>
  <div class="ticker-wrap">
    <div class="ticker-move" id="bottom-ticker">Loading breaking sports headlines...</div>
  </div>
</footer>
<script>
  const LEAGUES = Array.of(
    { id: 'MLB', tier: 1, sport: 'baseball', slug: 'mlb' },
    { id: 'NHL', tier: 1, sport: 'hockey', slug: 'nhl' },
    { id: 'CFL', tier: 1, sport: 'football', slug: 'cfl' },
    { id: 'NBA', tier: 2, sport: 'basketball', slug: 'nba' },
    { id: 'NFL', tier: 2, sport: 'football', slug: 'nfl' },
    { id: 'UFC', tier: 2, sport: 'mma', slug: 'ufc' },
    { id: 'WBC', tier: 3, sport: 'baseball', slug: 'world-baseball-classic' },
    { id: 'WINTER BB', tier: 3, sport: 'baseball', slug: 'caribbean-series' }
  );

  const TIER1_FAVS = Array.of('Blue Jays', 'Maple Leafs', 'Argonauts', 'Raptors', 'Toronto');
  const TIER2_FAVS = Array.of('Wild', 'Minnesota', 'Cardinals', 'St. Louis');

  let allGames = Array.of();
  let recapSlides = Array.of();
  let currentPage = 0;
  let previousScores = new Map();
  let isRecapPlaying = false;
  const CARDS_PER_PAGE = 6;

  function updateClock() {
    const now = new Date();
    document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  function getTeamPriority(teamName) {
    if (!teamName) return 99;
    const lower = teamName.toLowerCase();
    for (let i = 0; i < TIER1_FAVS.length; i++) {
      if (lower.includes(TIER1_FAVS.at(i).toLowerCase())) return 1 + (i * 0.1);
    }
    for (let i = 0; i < TIER2_FAVS.length; i++) {
      if (lower.includes(TIER2_FAVS.at(i).toLowerCase())) return 10 + (i * 0.1);
    }
    return 50;
  }

  function getScoreboardEndpoint(sport, slug) {
    const host = Array.of('site', 'web', 'api', 'espn', 'com').join('.');
    const parts = Array.of('https:', '', host, 'apis', 'site', 'v2', 'sports', sport, slug, 'scoreboard');
    return parts.join('/');
  }

  function getNewsEndpoint(sport, slug) {
    const host = Array.of('site', 'web', 'api', 'espn', 'com').join('.');
    const parts = Array.of('https:', '', host, 'apis', 'site', 'v2', 'sports', sport, slug, 'news');
    return parts.join('/');
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function isWithinActiveWindow(eventDateStr) {
    if (!eventDateStr) return true;
    const gameTime = new Date(eventDateStr).getTime();
    if (isNaN(gameTime)) return true;
    const now = Date.now();
    const hoursDiff = (gameTime - now) / (1000 * 60 * 60);
    return hoursDiff >= -24 && hoursDiff <= 36;
  }

  function isValidFreshNews(art) {
    if (!art || !art.headline) return false;
    const lower = art.headline.toLowerCase();
    if (lower.includes('highlight') || lower.includes('recap') || lower.startsWith('watch:') || lower.includes(' vs.') || lower.includes(' vs ')) {
      return false;
    }
    if (art.published) {
      const pubTime = new Date(art.published).getTime();
      if (!isNaN(pubTime)) {
        const ageHours = (Date.now() - pubTime) / (1000 * 60 * 60);
        if (ageHours > 36 || ageHours < -2) return false;
      }
    }
    return true;
  }

  function extractCardSubtext(comp, state, awayComp, homeComp) {
    if (state === 'pre') {
      const broadcasts = comp.broadcasts && comp.broadcasts.at(0);
      const tvNames = (broadcasts && broadcasts.names) ? broadcasts.names.join(' / ') : '';
      const venueName = (comp.venue && comp.venue.fullName) ? comp.venue.fullName : '';
      if (tvNames && venueName) return { label: 'TV', text: tvNames + ' • ' + venueName };
      if (tvNames) return { label: 'TV', text: tvNames };
      if (venueName) return { label: 'VENUE', text: venueName };
      return { label: 'UPCOMING', text: 'SCHEDULED MATCHUP' };
    }

    const leaders = comp.leaders;
    if (leaders && leaders.length > 0) {
      const primaryCat = leaders.at(0);
      const topLeader = primaryCat && primaryCat.leaders && primaryCat.leaders.at(0);
      if (topLeader && topLeader.athlete && topLeader.displayValue) {
        const playerName = topLeader.athlete.shortName || topLeader.athlete.displayName;
        return { label: 'TOP STAT', text: playerName + ' (' + topLeader.displayValue + ')' };
      }
    }

    const awayLines = awayComp && awayComp.linescores ? awayComp.linescores : Array.of();
    const homeLines = homeComp && homeComp.linescores ? homeComp.linescores : Array.of();
    if (awayLines.length > 0 && homeLines.length > 0) {
      let periods = Array.of();
      const count = Math.min(awayLines.length, homeLines.length, 4);
      for (let i = 0; i < count; i++) {
        const aVal = awayLines.at(i).value !== undefined ? awayLines.at(i).value : '-';
        const hVal = homeLines.at(i).value !== undefined ? homeLines.at(i).value : '-';
        periods.push('P' + (i + 1) + ': ' + aVal + '-' + hVal);
      }
      return { label: 'BOX', text: periods.join('  •  ') };
    }

    if (comp.headlines && comp.headlines.at(0) && comp.headlines.at(0).shortLinkText) {
      return { label: 'NOTE', text: comp.headlines.at(0).shortLinkText };
    }

    return { label: 'STATUS', text: state === 'in' ? 'IN PROGRESS' : 'FINAL SCORE' };
  }

  function updateTickerSpeed() {
    const tickerEl = document.getElementById('bottom-ticker');
    const containerWidth = tickerEl.parentElement.clientWidth || 1000;
    const textWidth = tickerEl.scrollWidth || 2000;
    const totalDistance = containerWidth + textWidth;
    const durationSeconds = Math.max(25, Math.round(totalDistance / 95));
    tickerEl.style.animationDuration = durationSeconds + 's';
  }
  async function fetchAllSports() {
    let fetchedGames = Array.of();
    let topStories = Array.of();
    let collectedSlides = Array.of();

    for (const lg of LEAGUES) {
      try {
        const endpoint = getScoreboardEndpoint(lg.sport, lg.slug);
        const res = await fetch(endpoint);
        if (res.ok) {
          const data = await res.json();
          const events = (data && data.events) ? data.events : Array.of();

          for (const ev of events) {
            if (!isWithinActiveWindow(ev.date)) continue;

            const comp = ev.competitions && ev.competitions.at(0);
            if (!comp || !comp.competitors) continue;

            if (lg.id === 'UFC') {
              if (comp.competitors.length >= 2) {
                const c0 = comp.competitors.at(0);
                const c1 = comp.competitors.at(1);
                const f1 = c0.athlete ? c0.athlete.displayName : 'Fighter 1';
                const f2 = c1.athlete ? c1.athlete.displayName : 'Fighter 2';
                const status = ev.status && ev.status.type ? ev.status.type.shortDetail : 'Scheduled';
                const state = ev.status && ev.status.type ? ev.status.type.state : 'pre';
                const ufcLogo = Array.of('https:', '', '://espncdn.com', 'i', 'teamlogos', 'leagues', '500', 'ufc.png').join('/');
                fetchedGames.push({
                  league: 'UFC',
                  leagueTier: lg.tier,
                  favScore: 40,
                  isLive: state === 'in',
                  isFinal: state === 'post',
                  status: status,
                  eventDate: ev.date || '',
                  subtext: extractCardSubtext(comp, state, c0, c1),
                  away: { name: f1, fullName: f1, score: c0.winner ? 'WIN' : '', logo: ufcLogo, record: '' },
                  home: { name: f2, fullName: f2, score: c1.winner ? 'WIN' : '', logo: ufcLogo, record: '' }
                });
              }
              continue;
            }

            const homeComp = comp.competitors.find(c => c.homeAway === 'home') || comp.competitors.at(0);
            const awayComp = comp.competitors.find(c => c.homeAway === 'away') || comp.competitors.at(1);
            if (!homeComp || !awayComp) continue;

            const homeName = (homeComp.team && (homeComp.team.shortDisplayName || homeComp.team.name)) || 'Home';
            const awayName = (awayComp.team && (awayComp.team.shortDisplayName || awayComp.team.name)) || 'Away';
            const homeFull = (homeComp.team && homeComp.team.displayName) || homeName;
            const awayFull = (awayComp.team && awayComp.team.displayName) || awayName;

            const bestFavScore = Math.min(getTeamPriority(homeFull), getTeamPriority(awayFull));
            const state = ev.status && ev.status.type ? ev.status.type.state : 'pre';
            const statusDetail = ev.status && ev.status.type ? ev.status.type.shortDetail : '';

            const awayRec = (awayComp.records && awayComp.records.at(0)) ? awayComp.records.at(0).summary : '';
            const homeRec = (homeComp.records && homeComp.records.at(0)) ? homeComp.records.at(0).summary : '';

            fetchedGames.push({
              league: lg.id,
              leagueTier: lg.tier,
              favScore: bestFavScore,
              isLive: state === 'in',
              isFinal: state === 'post',
              status: statusDetail,
              eventDate: ev.date || '',
              subtext: extractCardSubtext(comp, state, awayComp, homeComp),
              away: {
                name: awayName,
                fullName: awayFull,
                score: state === 'pre' ? '' : (awayComp.score || '0'),
                logo: (awayComp.team && awayComp.team.logo) || '',
                record: awayRec
              },
              home: {
                name: homeName,
                fullName: homeFull,
                score: state === 'pre' ? '' : (homeComp.score || '0'),
                logo: (homeComp.team && homeComp.team.logo) || '',
                record: homeRec
              }
            });
          }
        }
      } catch (e) {
        console.warn('Skipped scoreboard:', lg.id, e);
      }

      if (lg.tier <= 2) {
        try {
          const newsUrl = getNewsEndpoint(lg.sport, lg.slug);
          const newsRes = await fetch(newsUrl);
          if (newsRes.ok) {
            const newsData = await newsRes.json();
            const articles = (newsData && newsData.articles) ? newsData.articles : Array.of();
            let addedForLeague = 0;

            for (const art of articles) {
              if (!isValidFreshNews(art)) continue;
              if (addedForLeague < 3) {
                topStories.push(lg.id + ': ' + art.headline);
                addedForLeague++;
              }
              if (art.images && art.images.length > 0 && art.images.at(0).url) {
                collectedSlides.push({
                  league: lg.id,
                  headline: art.headline,
                  description: art.description || '',
                  imageUrl: art.images.at(0).url,
                  published: art.published || ''
                });
              }
            }
          }
        } catch (ne) {
          // Ignore news fetch issue
        }
      }

      await sleep(120);
    }

    fetchedGames.sort((a, b) => {
      if (a.favScore !== b.favScore) return a.favScore - b.favScore;
      if (a.isLive !== b.isLive) return a.isLive ? -1 : 1;
      return a.leagueTier - b.leagueTier;
    });

    allGames = fetchedGames;

    let activeTeamStartTimes = new Map();
    for (const g of allGames) {
      if (g.isLive || g.isFinal) {
        const startMs = g.eventDate ? new Date(g.eventDate).getTime() : 0;
        if (!isNaN(startMs) && startMs > 0) {
          activeTeamStartTimes.set(g.away.name.toLowerCase(), startMs);
          activeTeamStartTimes.set(g.home.name.toLowerCase(), startMs);
        }
      }
    }

    recapSlides = collectedSlides.filter(slide => {
      const pubMs = slide.published ? new Date(slide.published).getTime() : Date.now();
      const textLower = (slide.headline + ' ' + slide.description).toLowerCase();
      for (const entry of activeTeamStartTimes.entries()) {
        const teamKey = entry.at(0);
        const gameStartMs = entry.at(1);
        if (teamKey.length > 2 && textLower.includes(teamKey) && pubMs < gameStartMs) {
          return false;
        }
      }
      return true;
    }).slice(0, 5);

    const tickerEl = document.getElementById('bottom-ticker');
    if (topStories.length > 0) {
      tickerEl.textContent = topStories.join('     •     ');
    } else {
      tickerEl.textContent = 'LIVE SPORTS DESK • MLB • NHL • CFL • NBA • NFL • UFC';
    }
    updateTickerSpeed();

    renderBoard();
  }
  function renderBoard() {
    const grid = document.getElementById('scoreboard-grid');
    const indicator = document.getElementById('page-indicator');

    if (allGames.length === 0) {
      grid.innerHTML = '<div class="empty-state">No games within the active 24-hour window.<br><span style="font-size:1rem; margin-top:10px; display:block;">Auto-checking feeds every 45 seconds...</span></div>';
      indicator.textContent = 'STANDBY';
      return;
    }

    const totalPages = Math.ceil(allGames.length / CARDS_PER_PAGE);
    if (currentPage >= totalPages) currentPage = 0;

    const start = currentPage * CARDS_PER_PAGE;
    const pageGames = allGames.slice(start, start + CARDS_PER_PAGE);

    indicator.textContent = totalPages > 1
      ? ('PAGE ' + (currentPage + 1) + ' OF ' + totalPages + ' • ' + allGames.length + ' GAMES')
      : (allGames.length + ' GAMES');

    grid.innerHTML = pageGames.map((g, idx) => {
      const gameKey = g.league + '-' + g.away.name + '-' + g.home.name;
      const prev = previousScores.get(gameKey);
      const awayScored = prev && prev.away !== '' && g.away.score !== '' && prev.away !== g.away.score;
      const homeScored = prev && prev.home !== '' && g.home.score !== '' && prev.home !== g.home.score;
      previousScores.set(gameKey, { away: g.away.score, home: g.home.score });

      let cardClass = 'game-card';
      if (g.favScore < 10) cardClass += ' fav-tier1';
      else if (g.favScore < 50) cardClass += ' fav-tier2';
      if (g.isLive) cardClass += ' is-live-card';

      const awayScoreNum = parseInt(g.away.score, 10);
      const homeScoreNum = parseInt(g.home.score, 10);
      const showWinner = g.isFinal && !isNaN(awayScoreNum) && !isNaN(homeScoreNum);

      const awayClass = showWinner ? (awayScoreNum > homeScoreNum ? 'winner' : 'loser') : '';
      const homeClass = showWinner ? (homeScoreNum > awayScoreNum ? 'winner' : 'loser') : '';
      const delayStyle = 'animation-delay: ' + (idx * 85) + 'ms;';

      const footerStatHtml = g.subtext
        ? ('<div class="card-footer-stat"><span>' + g.subtext.label + '</span>' + g.subtext.text + '</div>')
        : '';

      return '<div class="' + cardClass + '" style="' + delayStyle + '">' +
        '<div class="card-header">' +
          '<span class="league-tag">' + g.league + '</span>' +
          '<span class="status-text ' + (g.isLive ? 'is-live' : '') + '">' + g.status + '</span>' +
        '</div>' +
        '<div class="team-row ' + (awayScored ? 'score-updated' : '') + '">' +
          '<div class="team-info">' +
            '<img class="team-logo" src="' + g.away.logo + '" onerror="this.style.display=\'none\'">' +
            '<span class="team-name ' + awayClass + '">' + g.away.name + '</span>' +
            '<span class="team-record">' + g.away.record + '</span>' +
          '</div>' +
          '<div class="team-score ' + awayClass + '">' + g.away.score + '</div>' +
        '</div>' +
        '<div class="team-row ' + (homeScored ? 'score-updated' : '') + '">' +
          '<div class="team-info">' +
            '<img class="team-logo" src="' + g.home.logo + '" onerror="this.style.display=\'none\'">' +
            '<span class="team-name ' + homeClass + '">' + g.home.name + '</span>' +
            '<span class="team-record">' + g.home.record + '</span>' +
          '</div>' +
          '<div class="team-score ' + homeClass + '">' + g.home.score + '</div>' +
        '</div>' +
        footerStatHtml +
      '</div>';
    }).join('');
  }

  async function triggerRecapBreak() {
    if (isRecapPlaying || recapSlides.length === 0) return;

    isRecapPlaying = true;
    const overlay = document.getElementById('recap-overlay');
    const imgEl = document.getElementById('recap-image');
    const badgeEl = document.getElementById('recap-league-badge');
    const headEl = document.getElementById('recap-headline');
    const subEl = document.getElementById('recap-subline');

    const slidesToShow = recapSlides.slice(0, 4);
    overlay.classList.add('active');

    for (const slide of slidesToShow) {
      imgEl.style.animation = 'none';
      void imgEl.offsetWidth;
      imgEl.style.animation = 'kenBurns 10s ease-out forwards';
      imgEl.src = slide.imageUrl;
      badgeEl.textContent = slide.league + ' DESK RECAP';
      headEl.textContent = slide.headline;
      subEl.textContent = slide.description;
      await sleep(10000);
    }

    overlay.classList.remove('active');
    isRecapPlaying = false;
  }

  window.addEventListener('resize', () => {
    updateTickerSpeed();
  });

  setInterval(() => {
    if (isRecapPlaying) return;
    const totalPages = Math.ceil(allGames.length / CARDS_PER_PAGE);
    if (totalPages > 1) {
      currentPage = (currentPage + 1) % totalPages;
      renderBoard();
    }
  }, 12000);

  setInterval(triggerRecapBreak, 1200000);

  fetchAllSports();
  setInterval(fetchAllSports, 45000);
</script>
</body>
</html>
